name: grumphp

on:
  workflow_dispatch:
  pull_request:
    branches: "*"
  push:
  schedule:
    - cron: '0 0 * * *'

jobs:
  test:
    name: "php: ${{ matrix.php }} TYPO3: ${{ matrix.typo3 }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        typo3: [false, '^13.4', '^14.0']
    container:
      image: kanti/buildy:${{ matrix.php }}
    env:
      COMPOSER_ROOT_VERSION: dev-main
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory /__w/grumphp-config/grumphp-config
      - if: ${{ ! matrix.typo3 }}
        run: |
          composer install --no-progress --no-scripts -n \
          && mv phpstan-baseline-without-typo3.neon phpstan-baseline.neon
      - if: ${{ matrix.typo3 }}
        # TYPO3 still requires ~0.22; 1.0.0 fixes the advisories without changing its API.
        # This CI-only alias installs/audits the real 1.0.0 release. Remove it once TYPO3 accepts ^1.0.
        run: >-
          TYPO3_SKIP_ASSET_PUBLISH=true composer req saschaegerer/phpstan-typo3 ssch/typo3-rector
          "typo3/cms-core:${{ matrix.typo3 }}" "enshrined/svg-sanitize:1.0.0 as 0.22.99"
          --no-progress --no-scripts -n
      - if: ${{ matrix.typo3 }}
        run: bash tests/typo3-svg-sanitizer.sh
      - run: ./vendor/bin/grumphp run --ansi

  test-packages:
    name: "${{ matrix.package }} php: ${{ matrix.php }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ['grumphp-bom-task', 'grumphp-xliff-task', 'phpstan-git-files', 'rector-p']
        php: ['8.2', '8.3', '8.4', '8.5']
    container:
      image: kanti/buildy:${{ matrix.php }}
    env:
      COMPOSER_ROOT_VERSION: dev-main
    defaults:
      run:
        working-directory: ./packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory /__w/grumphp-config/grumphp-config
      - run: composer install --no-progress --no-scripts -n
      - run: ./vendor/bin/grumphp run --ansi

  code-split:
    name: "Code Split ${{ matrix.package }}"
    needs:
      - test
      - test-packages
    if: ${{ ( startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' ) && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    environment: code split
    env:
      GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        package: ['grumphp-bom-task', 'grumphp-xliff-task', 'phpstan-git-files', 'rector-p', 'grumphp-fractor-task']
    steps:
      - uses: actions/checkout@v4
      - run: ./split.sh ${{ matrix.package }}
